plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Release signing: android/key.properties (written by CI from secrets, or
// created locally). Format:
//   storePassword=...  keyPassword=...  keyAlias=...  storeFile=upload-keystore.jks
// storeFile is resolved relative to android/app/.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKey = keystorePropertiesFile.exists()
if (hasReleaseKey) {
    keystorePropertiesFile.withReader('UTF-8') { reader -> keystoreProperties.load(reader) }
}


android {
    namespace "com.hamaraservice.provider"
    compileSdk 36
    ndkVersion flutter.ndkVersion
    compileOptions {
        // flutter_local_notifications requires core library desugaring
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    sourceSets { main.java.srcDirs += 'src/main/kotlin' }
    defaultConfig {
        applicationId "com.hamaraservice.provider"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }
    signingConfigs {
        if (hasReleaseKey) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            // Debug key is a LOCAL-ONLY fallback; such builds cannot be
            // published or installed over a Play-signed app.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}
if (!hasReleaseKey) {
    logger.warn("WARNING: android/key.properties not found — release build is signed with the DEBUG key (local testing only).")
}
flutter { source '../..' }
dependencies {
    implementation platform('com.google.firebase:firebase-bom:31.5.0')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
