name: hamaraservice_provider
description: HamaraService - Provider App
publish_to: none
version: 1.0.0+1


environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.32.0          # FCM only (no RTDB/Firestore/Storage/Auth)
  firebase_messaging: ^14.9.4
  flutter_local_notifications: ^17.2.4
  geolocator: ^11.1.0
  audioplayers: ^5.2.1
  geocoding: ^3.0.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.1
  http: ^1.2.0
  vibration: ^1.8.4
  image_picker: ^1.1.2
  flutter_map: ^6.1.0             # OSM map picker (service location & range)
  latlong2: ^0.9.0
  razorpay_flutter: ^1.3.7        # provider wallet top-up

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/